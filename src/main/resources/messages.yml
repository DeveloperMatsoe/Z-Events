# EventCore - messages.yml
# Opmaak: MiniMessage (https://docs.advntr.dev/minimessage/format.html)
# Placeholders staan tussen <...>, bijvoorbeeld <player>. Pas de tekst vrij aan, maar laat de placeholders staan.
# Ontbreekt een regel in dit bestand, dan wordt de standaardtekst uit de plugin gebruikt.
# Gebruik /event reload na het aanpassen.

